<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AR Guide | PLMUN Go</title>
  <link rel="icon" type="image/png" href="images/plmunlogo.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #020617; color: #fff; font-family: Poppins, Arial, sans-serif; overflow: hidden; }

    /* ---------- start screen ---------- */
    #start { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 28px; text-align: center; background: linear-gradient(160deg, #081e42, #0b3b8c); }
    #start h1 { margin: 0; font-size: 1.7rem; }
    #start p { margin: 0; max-width: 420px; opacity: .85; line-height: 1.6; }
    .btn { border: 0; border-radius: 30px; padding: 14px 28px; font-size: 1rem; font-weight: 700; cursor: pointer; background: #fde047; color: #081e42; }
    .btn.ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.5); }
    .back { color: #bfdbfe; font-size: .9rem; text-decoration: none; margin-top: 6px; }

    /* ---------- camera view ---------- */
    #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
    #hud { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; justify-content: space-between;
      padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); pointer-events: none; }
    #hud.on { display: flex; }
    #hud > * { pointer-events: auto; }

    .top { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
    .chip { background: rgba(8,30,66,.8); backdrop-filter: blur(6px); border-radius: 30px; padding: 9px 14px; font-size: .85rem; max-width: 70%; }
    .chip small { display: block; opacity: .7; font-size: .68rem; }
    .chip b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .round { width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(8,30,66,.8); color: #fff; font-size: 1.1rem; cursor: pointer; }

    /* scanning reticle */
    #reticle { position: absolute; left: 50%; top: 42%; width: 210px; height: 210px; transform: translate(-50%, -50%);
      border: 3px dashed rgba(253,224,71,.85); border-radius: 22px; pointer-events: none; animation: pulse 1.6s ease-in-out infinite; display: none; }
    #reticle.on { display: block; }
    #reticle span { position: absolute; left: 0; right: 0; bottom: -34px; text-align: center; font-size: .85rem; text-shadow: 0 1px 4px #000; }
    @keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.05); opacity: .7; } }

    /* the floating 3D arrow */
    #arrow-stage { position: absolute; left: 50%; top: 40%; width: 220px; height: 220px; margin: -110px 0 0 -110px; perspective: 600px; pointer-events: none; display: none; }
    #arrow-stage.on { display: block; }
    #arrow { width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateX(55deg); animation: float 1.8s ease-in-out infinite; }
    #arrow svg { width: 100%; height: 100%; filter: drop-shadow(0 12px 10px rgba(0,0,0,.55)); transition: transform .4s ease; }
    @keyframes float { 0%,100% { transform: rotateX(55deg) translateZ(0); } 50% { transform: rotateX(55deg) translateZ(34px); } }
    #arrow.up svg   { transform: rotate(0deg); }
    #arrow.right svg{ transform: rotate(90deg); }
    #arrow.down svg { transform: rotate(180deg); }
    #arrow.left svg { transform: rotate(-90deg); }
    #arrow.arrive svg { display: none; }
    #arrow .done { display: none; font-size: 6rem; text-align: center; line-height: 220px; }
    #arrow.arrive .done { display: block; }

    /* bottom card */
    .card { background: rgba(8,30,66,.88); backdrop-filter: blur(8px); border-radius: 20px; padding: 16px; max-height: 46vh; overflow-y: auto; }
    .card h3 { margin: 0 0 4px; font-size: 1.05rem; color: #fde047; }
    .card p { margin: 0 0 10px; line-height: 1.55; font-size: .95rem; }
    .card img { display: block; width: 100%; max-height: 150px; object-fit: cover; border-radius: 12px; margin: 0 0 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row .btn { padding: 10px 16px; font-size: .88rem; }
    .dests { display: flex; flex-wrap: wrap; gap: 8px; }
    .dests button { border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.1); color: #fff; border-radius: 20px; padding: 8px 14px; font-size: .88rem; cursor: pointer; }
    .dests button:hover { background: rgba(253,224,71,.3); }
    select { width: 100%; padding: 10px; border-radius: 10px; border: 0; font-size: .95rem; margin-bottom: 10px; }
    .note { font-size: .78rem; opacity: .75; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- START -->
  <div id="start">
    <h1>📍 PLMUN Go · AR Guide</h1>
    <p>Point your phone camera at a PLMUN Go QR code posted on campus. The guide shows an arrow and the next step on top of what you see.</p>
    <button class="btn" id="start-btn">Start camera</button>
    <button class="btn ghost" id="nocam-btn">Continue without camera</button>
    <a class="back" href="index.html">← Back to the website</a>
  </div>

  <video id="cam" autoplay playsinline muted></video>

  <!-- AR OVERLAY -->
  <div id="hud">
    <div class="top">
      <div class="chip"><small>You are here</small><b id="here-name">Not set: scan a QR code</b></div>
      <button class="round" id="mute" aria-label="Voice on/off">🔊</button>
      <button class="round" id="close" aria-label="Close">✕</button>
    </div>

    <div id="reticle"><span>Scan a PLMUN Go QR code</span></div>

    <div id="arrow-stage">
      <div id="arrow" class="up">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50 6 L88 52 L64 52 L64 94 L36 94 L36 52 L12 52 Z" fill="#fde047" stroke="#081e42" stroke-width="3" stroke-linejoin="round"/>
        </svg>
        <div class="done">🎉</div>
      </div>
    </div>

    <div class="card" id="card"></div>
  </div>

  <script>
  /* =========================================================================
     EDIT ME: what to show at each QR code.
       - the key ("Office of the University Registrar") must match the
         ?at=... name used by the QR code (see qr-codes.html)
       - dir is the way to go AS SEEN WHEN FACING THE QR CODE:
           "up" (straight ahead), "left", "right", "down" (turn around),
           "arrive" (you are there)
       - photo is optional (images/....png)
       - a destination can have many steps; the person taps "Next step",
         or just scans the next QR code on the way.
     The examples below are SAMPLES, replace them with your real campus.
     ========================================================================= */
  var AR_ROUTES = {
    'Office of the University Registrar': {
      'Treasury Office': [
        { dir: 'up',    text: 'Walk straight along the corridor.' },
        { dir: 'right', text: 'The Treasury Office is the next door on your right.', photo: '' }
      ],
      'Office of Student Affairs': [
        { dir: 'right', text: 'Take the stairs at the right end of the building.' },
        { dir: 'up',    text: 'Go up to the 2nd floor, then walk straight to the Office of Student Affairs.' }
      ]
    },
    'Treasury Office': {
      'Office of the University Registrar': [
        { dir: 'left', text: 'Walk back along the corridor. The Registrar is a few doors to your left.' }
      ]
    },
    'University Library': {
      'University Gymnasium': [
        { dir: 'down', text: 'Exit the building and head back to the quadrangle.' },
        { dir: 'up',   text: 'Walk across the quadrangle to the University Gymnasium.' }
      ]
    }
  };

  var SITE_HOME = 'index.html';
  </script>

  <script>
  (function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var video = $('cam'), hud = $('hud'), card = $('card'), reticle = $('reticle');
    var arrowStage = $('arrow-stage'), arrow = $('arrow');
    var here = null, dest = null, stepIdx = 0, stream = null, scanTimer = null, voiceOn = true;
    var detector = null;

    function places() {
      var s = {};
      Object.keys(AR_ROUTES).forEach(function (a) { s[a] = 1; Object.keys(AR_ROUTES[a]).forEach(function (b) { s[b] = 1; }); });
      return Object.keys(s).sort();
    }
    function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    function speak(t) {
      if (!voiceOn || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(t));
    }

    function setArrow(dir) {
      arrow.className = dir || 'up';
      arrowStage.classList.add('on');
    }

    /* ---------- UI states ---------- */
    function render() {
      $('here-name').textContent = here || 'Not set: scan a QR code';

      // 1. no location yet
      if (!here) {
        arrowStage.classList.remove('on');
        reticle.classList.toggle('on', !!detector);
        var opts = '<option value="">Choose where you are…</option>' + places().map(function (p) { return '<option>' + esc(p) + '</option>'; }).join('');
        card.innerHTML = '<h3>Where are you?</h3><p>' + (detector ? 'Point the camera at a PLMUN Go QR code, or choose your spot:' : 'This browser cannot scan QR codes. Choose your spot:') +
          '</p><select id="pick-here">' + opts + '</select>';
        $('pick-here').addEventListener('change', function (e) { if (e.target.value) setHere(e.target.value); });
        return;
      }

      reticle.classList.toggle('on', !!detector && !dest);

      // 2. location set, no destination
      if (!dest) {
        arrowStage.classList.remove('on');
        var list = AR_ROUTES[here] ? Object.keys(AR_ROUTES[here]) : [];
        card.innerHTML = '<h3>Where do you want to go?</h3>' +
          (list.length ? '<div class="dests">' + list.map(function (d) { return '<button data-d="' + esc(d) + '">' + esc(d) + '</button>'; }).join('') + '</div>'
                       : '<p>No routes are set up from here yet. Scan another QR code.</p>') +
          '<p class="note">Tip: scan the next QR code on your way and the guide continues by itself.</p>';
        card.querySelectorAll('[data-d]').forEach(function (b) { b.addEventListener('click', function () { setDest(b.getAttribute('data-d')); }); });
        return;
      }

      // 3. arrived
      if (here === dest) {
        setArrow('arrive');
        card.innerHTML = '<h3>You have arrived! 🎉</h3><p>' + esc(dest) + '</p><div class="row"><button class="btn" id="again">Find another place</button></div>';
        $('again').addEventListener('click', function () { dest = null; stepIdx = 0; render(); });
        speak('You have arrived at ' + dest);
        return;
      }

      // 4. a route is active
      var steps = (AR_ROUTES[here] && AR_ROUTES[here][dest]) || null;
      if (!steps) {
        arrowStage.classList.remove('on');
        card.innerHTML = '<h3>No route from here</h3><p>There is no AR route from <b>' + esc(here) + '</b> to <b>' + esc(dest) + '</b> yet. Scan a QR code closer to the start, or choose another place.</p>' +
          '<div class="row"><button class="btn" id="change-dest">Choose another place</button></div>';
        $('change-dest').addEventListener('click', function () { dest = null; render(); });
        return;
      }
      var st = steps[Math.min(stepIdx, steps.length - 1)];
      setArrow(st.dir);
      var last = stepIdx >= steps.length - 1;
      card.innerHTML =
        '<h3>To ' + esc(dest) + ' · step ' + (Math.min(stepIdx, steps.length - 1) + 1) + ' of ' + steps.length + '</h3>' +
        (st.photo ? '<img src="' + esc(st.photo) + '" alt="" onerror="this.remove()">' : '') +
        '<p>' + esc(st.text) + '</p>' +
        '<div class="row">' +
          (last ? '<button class="btn" id="arrived">I have arrived</button>' : '<button class="btn" id="next">Next step</button>') +
          '<button class="btn ghost" id="say">🔊 Read</button><button class="btn ghost" id="cancel">Cancel</button></div>';
      var nx = $('next'); if (nx) nx.addEventListener('click', function () { stepIdx++; render(); });
      var ar = $('arrived'); if (ar) ar.addEventListener('click', function () { here = dest; stepIdx = 0; render(); });
      $('say').addEventListener('click', function () { speak(st.text); });
      $('cancel').addEventListener('click', function () { dest = null; stepIdx = 0; render(); });
      speak(st.text);
    }

    function setHere(name) {
      // match loosely against known places
      var all = places(), n = name.toLowerCase();
      var hit = all.filter(function (p) { return p.toLowerCase() === n; })[0] ||
                all.filter(function (p) { return p.toLowerCase().indexOf(n) !== -1 || n.indexOf(p.toLowerCase()) !== -1; })[0] || name;
      here = hit; stepIdx = 0;
      try { localStorage.setItem('plmun-here', hit); } catch (e) { }   // same spot as the main website
      if (navigator.vibrate) navigator.vibrate(60);
      render();
    }
    function setDest(d) { dest = d; stepIdx = 0; render(); }

    /* ---------- QR scanning (Chrome / Edge / Android) ---------- */
    function parseQr(text) {
      try { var u = new URL(text); var at = u.searchParams.get('at'); if (at) return at; } catch (e) { }
      return text && text.length < 80 ? text : null;
    }
    function startScan() {
      if (!('BarcodeDetector' in window)) return;
      try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; return; }
      var busy = false, lastSeen = '';
      scanTimer = setInterval(function () {
        if (busy || video.readyState < 2) return;
        busy = true;
        detector.detect(video).then(function (codes) {
          if (codes.length) {
            var at = parseQr(codes[0].rawValue);
            if (at && at !== lastSeen) { lastSeen = at; setHere(at); }
          } else { lastSeen = ''; }
        }).catch(function () { }).then(function () { busy = false; });
      }, 450);
    }

    /* ---------- start / stop ---------- */
    function open(withCamera) {
      $('start').style.display = 'none';
      hud.classList.add('on');
      try { var saved = localStorage.getItem('plmun-here'); if (saved && !here) here = saved; } catch (e) { }
      var q = new URLSearchParams(location.search).get('at'); if (q) here = q;
      if (!withCamera) { video.style.display = 'none'; document.body.style.background = 'linear-gradient(160deg,#081e42,#0b3b8c)'; }
      if (withCamera) startScan();
      render();
    }

    $('start-btn').addEventListener('click', function () {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert('Camera is not available in this browser. Use the no-camera mode.'); return; }
      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }).then(function (s) {
        stream = s; video.srcObject = s; open(true);
      }).catch(function () {
        alert('Could not open the camera. Allow camera access in your browser, or use the no-camera mode.');
      });
    });
    $('nocam-btn').addEventListener('click', function () { open(false); });
    $('close').addEventListener('click', function () {
      if (scanTimer) clearInterval(scanTimer);
      if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      window.speechSynthesis && window.speechSynthesis.cancel();
      window.location.href = SITE_HOME;
    });
    $('mute').addEventListener('click', function () {
      voiceOn = !voiceOn; this.textContent = voiceOn ? '🔊' : '🔇';
      if (!voiceOn && window.speechSynthesis) window.speechSynthesis.cancel();
    });
  })();
  </script>
</body>
</html>
