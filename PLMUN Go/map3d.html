<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Campus Map | PLMUN Go</title>
  <!-- Needs routes.js in the same folder (the layout + route steps). No other libraries. -->
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: Poppins, Arial, sans-serif; background: #0b2a5b; color: #fff; }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    #stage.drag { cursor: grabbing; }
    .top { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: center; padding: 10px 12px; pointer-events: none; z-index: 5; }
    .top > * { pointer-events: auto; }
    .back { background: rgba(8,30,66,.85); color: #fff; text-decoration: none; padding: 9px 14px; border-radius: 999px; font-size: .85rem; font-weight: 600; border: 1px solid rgba(255,255,255,.25); }
    .title { font-weight: 700; font-size: 1rem; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
    .chips { position: fixed; top: 56px; left: 0; right: 0; padding: 0 12px; display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; z-index: 5; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { white-space: nowrap; flex: 0 0 auto; }
    .chip { border: 1px solid rgba(255,255,255,.3); background: rgba(8,30,66,.8); color: #fff; padding: 7px 12px; border-radius: 999px; font-size: .8rem; cursor: pointer; font-family: inherit; }
    .chip.on { background: #fde047; color: #081e42; border-color: #fde047; font-weight: 700; }
    #floors { top: 100px; }
    .panel { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(8,30,66,.96); border-radius: 20px 20px 0 0; padding: 10px 14px 14px; z-index: 6; max-height: 52vh; overflow-y: auto; box-shadow: 0 -6px 24px rgba(0,0,0,.4); }
    .panel.min .body { display: none; }
    .grab { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 700; padding: 2px 0 6px; }
    .grab small { font-weight: 500; opacity: .7; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .row select { flex: 1 1 150px; min-width: 0; padding: 10px; border-radius: 10px; border: 0; font-size: .88rem; font-family: inherit; }
    .btn { border: 0; background: #fde047; color: #081e42; font-weight: 700; padding: 10px 16px; border-radius: 12px; cursor: pointer; font-family: inherit; font-size: .88rem; }
    .btn.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); }
    ol { margin: 6px 0 0; padding: 0; list-style: none; counter-reset: s; }
    ol li { counter-increment: s; position: relative; padding: 8px 10px 8px 40px; margin-bottom: 6px; background: rgba(255,255,255,.07); border-radius: 10px; font-size: .86rem; line-height: 1.45; }
    ol li::before { content: counter(s); position: absolute; left: 10px; top: 8px; width: 22px; height: 22px; border-radius: 50%; background: #fde047; color: #081e42; font-weight: 700; font-size: .75rem; display: flex; align-items: center; justify-content: center; }
    .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: .72rem; opacity: .85; margin-top: 8px; }
    .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
    #info { position: fixed; left: 12px; right: 12px; bottom: 70px; z-index: 7; background: #fff; color: #081e42; border-radius: 14px; padding: 12px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.35); display: none; max-width: 420px; }
    #info b { display: block; font-size: 1rem; }
    #info small { color: #64748b; }
    #info .row { margin: 8px 0 0; }
    #info .btn { padding: 8px 12px; font-size: .8rem; }
    #info .btn.ghost { color: #081e42; border-color: #94a3b8; }
    .hint { position: fixed; right: 12px; top: 14px; font-size: .72rem; opacity: .8; text-align: right; z-index: 4; pointer-events: none; }
    @media (max-width: 700px) { .hint { display: none; } }
    @media (min-width: 900px) { .panel { left: auto; right: 16px; bottom: 16px; width: 400px; border-radius: 18px; max-height: 70vh; } #info { left: 16px; bottom: 16px; } }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="top">
    <a class="back" href="index.html">← Home</a>
    <span class="title">3D Campus Map</span>
  </div>
  <div class="hint">Drag to turn · pinch / scroll to zoom · tap a room</div>
  <div class="chips" id="blds"></div>
  <div class="chips" id="floors"></div>

  <div id="info"></div>

  <div class="panel" id="panel">
    <div class="grab" id="grab"><span>🧭 Show a route</span><small id="gstate">tap to close</small></div>
    <div class="body">
      <div class="row"><select id="from"></select><select id="to"></select></div>
      <div class="row"><button class="btn" id="go">Show route</button><button class="btn ghost" id="swap">Swap</button><button class="btn ghost" id="clear">Clear</button></div>
      <ol id="steps"></ol>
      <div class="legend">
        <span><i style="background:#2f7de1"></i>Room</span><span><i style="background:#f59e0b"></i>Stairs</span>
        <span><i style="background:#a855f7"></i>Elevator</span><span><i style="background:#22c55e"></i>Main doors</span>
        <span><i style="background:#7b8794"></i>CR</span><span><i style="background:#fde047"></i>Route</span>
      </div>
    </div>
  </div>

  <script src="routes.js"></script>
  <script>
  (function () {
    'use strict';
    var L = window.PLMunLayout, BLD = L.BUILDINGS;
    var $ = function (id) { return document.getElementById(id); };
    var cv = $('stage'), ctx = cv.getContext('2d');
    var H = 3.6;                                   // height of one floor (map units)

    /* ===== 1. WHERE EVERYTHING STANDS (map units; from the university map) =====
       x = east, z = south. The main gate is at the bottom-left. Change a number to move or resize a building. */
    var G = {
      mabini:    { x0: 9,  x1: 26, z0: 24, z1: 32.5, floors: 3, color: '#3b7dd8', mode: 'north', label: 'Student Center' },
      bonifacio: { x0: 33, x1: 54, z0: 24, z1: 32.5, floors: 4, color: '#2f9e63', mode: 'two',   label: 'Main (Bonifacio)' },
      delpilar:  { x0: 57, x1: 73, z0: 24, z1: 32.5, floors: 5, color: '#d19a2a', mode: 'two',   label: 'Admin (Del Pilar)' },
      rizal:     { x0: 40, x1: 72, z0: 40, z1: 48,   floors: 4, color: '#8b5cf6', mode: 'south', label: 'RLRC (Rizal)', flip: true }
    };
    var ORDER = ['mabini', 'bonifacio', 'delpilar', 'rizal'];
    var NAMES = { mabini: 'Student Center', bonifacio: 'Main (Bonifacio)', delpilar: 'Admin (Del Pilar)', rizal: 'RLRC (Rizal)' };
    var WALK_Z = 34.5, GATE = { x: 7, z: 56 };

    function rowDepth(g) { return 3; }
    // rectangle of one cell on a floor plan
    function cellRect(bk, row, idx, len) {
      var g = G[bk], W = g.x1 - g.x0, a = idx / len, b = (idx + 1) / len, x0, x1, z0, z1;
      if (g.flip) { x0 = g.x1 - b * W; x1 = g.x1 - a * W; } else { x0 = g.x0 + a * W; x1 = g.x0 + b * W; }
      if (g.mode === 'two') {
        if (row === 'back') { z0 = g.z0; z1 = g.z0 + 3; } else { z0 = g.z1 - 3; z1 = g.z1; }
      } else if (g.mode === 'north') { z0 = g.z0; z1 = g.z0 + 5.5; }
      else { z0 = g.z0 + 2.5; z1 = g.z1; }
      return { x0: x0, x1: x1, z0: z0, z1: z1 };
    }
    function hallZ(bk) {
      var g = G[bk];
      if (g.mode === 'two') return (g.z0 + g.z1) / 2;
      if (g.mode === 'north') return g.z0 + 5.5 + (g.z1 - g.z0 - 5.5) / 2;
      return g.z0 + 1.25;
    }

    /* ===== 2. camera ===== */
    var cam = { yaw: 0.25, pitch: 1.0, dist: 128, tx: 43, ty: 0, tz: 38 }, goal = null;
    var W = 0, Hh = 0, dpr = 1, FOV = 1, CX = 0, CY = 0;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; Hh = window.innerHeight;
      cv.width = W * dpr; cv.height = Hh * dpr; cv.style.width = W + 'px'; cv.style.height = Hh + 'px';
      FOV = Math.max(W, Hh) * 1.05;
      // keep the map clear of the bottom sheet / side panel
      CX = W / 2; CY = W >= 900 ? Hh * 0.52 : Hh * 0.44;
    }
    var cy, sy_, cp, sp_;
    function setM() { cy = Math.cos(cam.yaw); sy_ = Math.sin(cam.yaw); cp = Math.cos(cam.pitch); sp_ = Math.sin(cam.pitch); }
    function proj(x, y, z) {
      var qx = x - cam.tx, qy = y - cam.ty, qz = z - cam.tz;
      var x1 = qx * cy + qz * sy_, z1 = -qx * sy_ + qz * cy, dp = -z1;
      var y2 = qy * cp + dp * sp_, d = cam.dist + dp * cp - qy * sp_;
      if (d < 1) d = 1;
      return { x: CX + FOV * x1 / d, y: CY - FOV * y2 / d, d: d };
    }
    function camPos() {
      var zp = cam.dist * cp, yy = cam.dist * sp_;
      return { x: cam.tx - zp * sy_, y: cam.ty + yy, z: cam.tz + zp * cy };
    }

    /* ===== 3. drawing helpers ===== */
    var LIGHT = (function () { var l = [-0.45, 0.8, 0.4], n = Math.hypot(l[0], l[1], l[2]); return [l[0] / n, l[1] / n, l[2] / n]; })();
    function shade(hex, f) {
      var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
      return 'rgb(' + Math.min(255, Math.round(r * f)) + ',' + Math.min(255, Math.round(g * f)) + ',' + Math.min(255, Math.round(b * f)) + ')';
    }
    var hits = [], labels = [];
    // faces of a box: [normal, 4 corners]
    function boxFaces(x0, x1, y0, y1, z0, z1) {
      return [
        { n: [0, 1, 0],  p: [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]] },
        { n: [0, 0, 1],  p: [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]] },
        { n: [0, 0, -1], p: [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]] },
        { n: [1, 0, 0],  p: [[x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0]] },
        { n: [-1, 0, 0], p: [[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]] }
      ];
    }
    var cpos;
    function drawBox(x0, x1, y0, y1, z0, z1, color, alpha, o, noCull) {
      o = o || {};
      var faces = boxFaces(x0, x1, y0, y1, z0, z1), cx = (x0 + x1) / 2, cyy = (y0 + y1) / 2, cz = (z0 + z1) / 2, list = [];
      faces.forEach(function (f) {
        var fc = [0, 0, 0];
        f.p.forEach(function (q) { fc[0] += q[0] / 4; fc[1] += q[1] / 4; fc[2] += q[2] / 4; });
        var vx = cpos.x - fc[0], vy = cpos.y - fc[1], vz = cpos.z - fc[2];
        if (!noCull && f.n[0] * vx + f.n[1] * vy + f.n[2] * vz <= 0) return;
        var pp = f.p.map(function (q) { return proj(q[0], q[1], q[2]); });
        var d = (pp[0].d + pp[1].d + pp[2].d + pp[3].d) / 4;
        var lam = Math.max(0, f.n[0] * LIGHT[0] + f.n[1] * LIGHT[1] + f.n[2] * LIGHT[2]);
        list.push({ pp: pp, d: d, f: 0.62 + 0.45 * lam, top: f.n[1] === 1, face: f });
      });
      list.sort(function (a, b) { return b.d - a.d; });
      list.forEach(function (it) {
        ctx.beginPath();
        ctx.moveTo(it.pp[0].x, it.pp[0].y);
        for (var i = 1; i < 4; i++) ctx.lineTo(it.pp[i].x, it.pp[i].y);
        ctx.closePath();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = shade(color, it.f);
        ctx.fill();
        ctx.globalAlpha = Math.min(1, alpha + 0.25);
        ctx.strokeStyle = o.stroke || 'rgba(8,30,66,.55)';
        ctx.lineWidth = o.lw || 1;
        ctx.stroke();
        if (o.windows && !it.top) windows(it.face, alpha, it.f);
        if (o.room && it.top) hits.push({ poly: it.pp, room: o.room });
      });
      ctx.globalAlpha = 1;
      return proj(cx, y1, cz);
    }
    function windows(face, alpha, f) {
      var P0 = face.p[0], P1 = face.p[1], P3 = face.p[3];
      var w = Math.hypot(P1[0] - P0[0], P1[2] - P0[2]), N = Math.max(1, Math.round(w / 2.3));
      function pt(u, v) { return proj(P0[0] + (P1[0] - P0[0]) * u + (P3[0] - P0[0]) * v, P0[1] + (P3[1] - P0[1]) * v, P0[2] + (P1[2] - P0[2]) * u + (P3[2] - P0[2]) * v); }
      ctx.globalAlpha = Math.min(1, alpha); ctx.fillStyle = shade('#bfe3ff', f);
      for (var i = 0; i < N; i++) {
        var u0 = (i + 0.22) / N, u1 = (i + 0.78) / N, a = pt(u0, 0.3), b = pt(u1, 0.3), c = pt(u1, 0.72), d = pt(u0, 0.72);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    function flat(x0, x1, z0, z1, y, color, alpha) {
      var pp = [[x0, z0], [x1, z0], [x1, z1], [x0, z1]].map(function (q) { return proj(q[0], y, q[1]); });
      ctx.beginPath(); ctx.moveTo(pp[0].x, pp[0].y); for (var i = 1; i < 4; i++) ctx.lineTo(pp[i].x, pp[i].y); ctx.closePath();
      ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.fillStyle = color; ctx.fill(); ctx.globalAlpha = 1;
    }
    function flatPoly(pts, y, color, alpha) {
      ctx.beginPath(); pts.forEach(function (q, i) { var p = proj(q[0], y, q[1]); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
      ctx.closePath(); ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.fillStyle = color; ctx.fill(); ctx.globalAlpha = 1;
    }
    function stroke3(pts, color, w, y) {
      ctx.beginPath(); pts.forEach(function (q, i) { var p = proj(q[0], y || 0.05, q[1]); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
      ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
    }
    function text(t, x, y, size, color, bg) {
      ctx.font = '600 ' + size + 'px Poppins, Arial, sans-serif';
      var w = ctx.measureText(t).width;
      if (bg) { ctx.fillStyle = bg; var r = 4; ctx.beginPath(); ctx.rect(x - w / 2 - 5, y - size * 0.85, w + 10, size * 1.5); ctx.fill(); }
      ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.fillText(t, x, y + size * 0.3 - size * 0.05);
    }

    /* ===== 4. state ===== */
    var focus = null, floorSel = null, route = null, routeSteps = [], marks = [], selRoom = null, t0 = Date.now();

    function floorsOf(bk) { return Object.keys(BLD[bk].floors).map(Number).sort(function (a, b) { return a - b; }); }

    // is this floor drawn, and how?
    function floorMode(bk, f) {
      if (route) return 'ghost';
      if (focus && focus !== bk) return 'dim';
      if (focus === bk && floorSel) { if (f > floorSel) return 'hidden'; if (f === floorSel) return 'rooms'; return 'below'; }
      return 'solid';
    }

    /* ===== 5. the scene ===== */
    function rnd(seed) { var x = Math.sin(seed * 127.1) * 43758.5453; return x - Math.floor(x); }
    var TREES = (function () {
      var out = [], id = 1;
      function scatter(x0, x1, z0, z1, n) { for (var i = 0; i < n; i++) { id++; out.push({ x: x0 + rnd(id) * (x1 - x0), z: z0 + rnd(id + 99) * (z1 - z0), h: 3.6 + rnd(id + 7) * 2.6, pine: rnd(id + 3) > 0.7, c: Math.floor(rnd(id + 11) * 4) }); } }
      scatter(-3, 4.2, 22, 60, 7);        // west edge
      scatter(9.5, 25.5, 43, 46.5, 6);       // Serenity Garden
      scatter(30, 52, 52.5, 56, 8);         // Centennial Park
      scatter(2, 86, 14.5, 20, 16);        // behind the buildings
      scatter(77, 88, 20, 62, 9);         // east side / North Park
      scatter(56, 76, 53, 60, 6);
      [[30.8, 38.6], [72.2, 38.6], [72.2, 33.8]].forEach(function (p) { id++; out.push({ x: p[0], z: p[1], h: 4.5, pine: false, c: 1 }); });
      return out;
    })();
    var CANOPY = ['#2f8f46', '#3aa655', '#287a3c', '#4db35f'];
    function drawTree(t) {
      var base = proj(t.x, 0, t.z), mid = proj(t.x, t.h * 0.45, t.z), top = proj(t.x, t.h, t.z);
      var r = FOV * (t.h * 0.30) / base.d, rt = r;
      ctx.beginPath(); ctx.ellipse(base.x + r * 0.3, base.y, r * 0.9, r * 0.32, 0, 0, 7); ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(mid.x, mid.y); ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = Math.max(1.5, r * 0.28); ctx.stroke();
      var col = CANOPY[t.c];
      if (t.pine) {
        var ap = proj(t.x, t.h * 1.12, t.z), bs = proj(t.x, t.h * 0.3, t.z);
        ctx.beginPath(); ctx.moveTo(ap.x, ap.y); ctx.lineTo(bs.x + r * 0.95, bs.y); ctx.lineTo(bs.x - r * 0.95, bs.y); ctx.closePath();
        ctx.fillStyle = '#1f6b3a'; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.stroke();
      } else {
        var cy_ = (mid.y + top.y) / 2 - r * 0.15;
        var gr = ctx.createRadialGradient(top.x - r * 0.3, cy_ - r * 0.4, r * 0.1, top.x, cy_, r * 1.1);
        gr.addColorStop(0, '#8fdc8a'); gr.addColorStop(0.45, col); gr.addColorStop(1, '#1d5e31');
        ctx.beginPath(); ctx.arc(top.x, cy_, r * 1.05, 0, 7); ctx.fillStyle = gr; ctx.fill();
      }
    }
    function roadSeg(x0, z0, x1, z1, w) {          // flat road strip between two points (axis aligned)
      var h = w / 2;
      if (x0 === x1) flat(x0 - h, x0 + h, Math.min(z0, z1) - h, Math.max(z0, z1) + h, 0.05, '#4b5563');
      else flat(Math.min(x0, x1) - h, Math.max(x0, x1) + h, z0 - h, z0 + h, 0.05, '#4b5563');
    }
    function drawGround() {
      // island base
      drawBox(-6, 92, -2.2, 0, 11, 65, '#8b6b4a', 1, { stroke: 'rgba(0,0,0,.25)' });
      flat(-6, 92, 11, 65, 0, '#9cc98a');
      // lawn stripes
      for (var i = 0; i < 12; i++) flat(-6, 92, 11 + i * 4.5, 13.2 + i * 4.5, 0.01, '#94c382', 0.55);
      // parks / gardens
      flat(9, 26.5, 41.8, 47, 0.03, '#7fcf6a'); flat(76.5, 90, 36, 45, 0.03, '#7fcf6a'); flat(29.5, 53, 51.6, 56.2, 0.03, '#7fcf6a');
      flat(62, 72, 52.5, 56.5, 0.04, '#5b8fd6');
      // shadows of the buildings
      ORDER.forEach(function (bk) { var g = G[bk], hh = floorsOf(bk).length * H; flat(g.x0 + 1.2, g.x1 + 0.8 + hh * 0.25, g.z0 + 1, g.z1 + 1 + hh * 0.3, 0.04, '#000', 0.16); });
      // ring road (as on the university map): gate -> west pocket -> north -> east -> south -> back to the quadrangle
      roadSeg(7, 62, 7, 34.5, 3);
      roadSeg(7, 34.5, 28, 34.5, 3);
      roadSeg(28, 22, 28, 50, 2.8);
      roadSeg(28, 22, 75, 22, 2.8);
      roadSeg(75, 22, 75, 50, 2.8);
      roadSeg(28, 50, 75, 50, 2.8);
      [[[7, 62], [7, 34.5], [28, 34.5]], [[28, 22], [75, 22], [75, 50], [28, 50], [28, 22]]].forEach(function (p) {
        ctx.setLineDash([6, 6]); stroke3(p, 'rgba(255,255,255,.75)', 1.2, 0.06); ctx.setLineDash([]);
      });
      // the QUADRANGLE: paved open space between the Main/Admin row and the RLRC
      flat(29.4, 73.6, 32.5, 40, 0.06, '#e6dcc3');
      ctx.strokeStyle = 'rgba(120,100,60,.28)'; ctx.lineWidth = 1;
      for (var x = 29.4; x <= 73.7; x += 4.43) { var p1 = proj(x, 0.07, 32.5), p2 = proj(x, 0.07, 40); ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
      for (var z = 32.5; z <= 40.1; z += 1.9) { var q1 = proj(29.4, 0.07, z), q2 = proj(73.6, 0.07, z); ctx.beginPath(); ctx.moveTo(q1.x, q1.y); ctx.lineTo(q2.x, q2.y); ctx.stroke(); }
      // the walkway to the RLRC through the gap between Main and Admin

    }

    /* ===== 9. UI ===== */
    function fly(o) { goal = { tx: o.tx, ty: o.ty || 0, tz: o.tz, dist: o.dist, yaw: o.yaw == null ? cam.yaw : o.yaw, pitch: o.pitch == null ? cam.pitch : o.pitch }; }
    function chips() {
      var b = $('blds'); b.innerHTML = '';
      function mk(label, key) {
        var c = document.createElement('button'); c.className = 'chip' + (focus === key ? ' on' : ''); c.textContent = label;
        c.onclick = function () { setFocus(key); }; b.appendChild(c);
      }
      mk('Whole campus', null); ORDER.forEach(function (k) { mk(NAMES[k], k); });
      var f = $('floors'); f.innerHTML = '';
      if (focus) {
        var all = document.createElement('button'); all.className = 'chip' + (!floorSel ? ' on' : ''); all.textContent = 'All floors';
        all.onclick = function () { floorSel = null; chips(); }; f.appendChild(all);
        floorsOf(focus).forEach(function (n) {
          var c = document.createElement('button'); c.className = 'chip' + (floorSel === n ? ' on' : ''); c.textContent = L.ORD[n] + ' floor';
          c.onclick = function () { floorSel = n; chips(); }; f.appendChild(c);
        });
      }
    }
    function setFocus(k) {
      focus = k; floorSel = null; route = null; $('steps').innerHTML = ''; $('info').style.display = 'none'; selRoom = null; chips();
      if (!k) fly({ tx: 43, tz: 38, dist: 128, yaw: 0.25, pitch: 1.0 });
      else { var g = G[k]; fly({ tx: (g.x0 + g.x1) / 2, ty: 3, tz: (g.z0 + g.z1) / 2, dist: Math.max(34, (g.x1 - g.x0) * 1.5), yaw: 0.2, pitch: 0.95 }); }
    }
    function fill(sel) {
      var html = '<option value="">' + (sel === 'from' ? 'From: where are you?' : 'To: where to?') + '</option>', groups = {}, ord = [];
      L.ROOMS.forEach(function (r) { var g = r.bk === 'campus' ? 'Campus grounds' : BLD[r.bk].name; if (!groups[g]) { groups[g] = []; ord.push(g); } groups[g].push(r); });
      ord.forEach(function (g) {
        html += '<optgroup label="' + g + '">' + groups[g].map(function (r) { return '<option value="' + r.key.replace(/"/g, '&quot;') + '">' + r.name.replace(/&/g, '&amp;') + (r.bk === 'campus' ? '' : ' · ' + r.floor + 'F') + '</option>'; }).join('') + '</optgroup>';
      });
      $(sel).innerHTML = html;
    }
    function showRoute() {
      var a = L.BY_KEY[$('from').value], b = L.BY_KEY[$('to').value];
      if (!a || !b) { $('steps').innerHTML = '<li>Pick where you are and where you want to go.</li>'; return; }
      if (a.key === b.key) { $('steps').innerHTML = '<li>You are already there.</li>'; return; }
      focus = null; floorSel = null; chips();
      route = routePoints(a, b);
      routeSteps = L.route(a, b);
      $('steps').innerHTML = routeSteps.map(function (s) { return '<li></li>'; }).join('');
      Array.prototype.forEach.call($('steps').children, function (li, i) { li.textContent = routeSteps[i].text; });
      $('info').style.display = 'none';
      // frame the whole route
      var minx = 1e9, maxx = -1e9, minz = 1e9, maxz = -1e9;
      route.forEach(function (p) { minx = Math.min(minx, p.x); maxx = Math.max(maxx, p.x); minz = Math.min(minz, p.z); maxz = Math.max(maxz, p.z); });
      var span = Math.max(maxx - minx, (maxz - minz) * 1.4, 22);
      fly({ tx: (minx + maxx) / 2 + (W >= 900 ? span * 0.22 : 0), ty: 3, tz: (minz + maxz) / 2, dist: Math.min(240, span * (W < 700 ? 2.7 : 1.9) + 20), pitch: 0.9 });
      $('gstate').textContent = 'tap to hide';
    }
    $('go').onclick = showRoute;
    $('swap').onclick = function () { var t = $('from').value; $('from').value = $('to').value; $('to').value = t; if ($('from').value && $('to').value) showRoute(); };
    $('clear').onclick = function () { route = null; $('steps').innerHTML = ''; $('from').value = ''; $('to').value = ''; setFocus(null); };
    $('grab').onclick = function () { var p = $('panel'); p.classList.toggle('min'); $('gstate').textContent = p.classList.contains('min') ? 'tap to open' : 'tap to hide'; };

    window.addEventListener('resize', resize);
    resize(); fill('from'); fill('to'); chips();
    if (window.innerWidth < 900) { /* leave the panel open but short */ }
    // ?from=...&to=... opens a route straight away (handy for QR codes)
    try {
      var q = new URLSearchParams(location.search);
      if (q.get('from')) { var a = L.find(q.get('from')); if (a) $('from').value = a.key; }
      if (q.get('to')) { var b = L.find(q.get('to')); if (b) $('to').value = b.key; }
      if ($('from').value && $('to').value) showRoute();
    } catch (e) { }
    window.PLMun3D = { showRoute: showRoute, setFocus: setFocus, cam: cam, G: G, setFloor: function (n) { floorSel = n; chips(); } };
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
